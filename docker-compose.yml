services:
  api:
    build:
      context: ./backend
      dockerfile: cmd/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_DATABASE_URL: postgres://lineview_app:dev_app@db:5432/lineview_db?sslmode=disable
      AUTH_DATABASE_URL: postgres://lineview_auth:dev_auth@db:5432/lineview_db?sslmode=disable
      TENANT_MODE: ${TENANT_MODE:-safe}
      APP_MAX_CONNS: "10"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  loader:
    build:
      context: ./backend
      dockerfile: cmd/loader/Dockerfile
    profiles: ["load"]
    command: ["-workers", "4"]
    volumes:
      - ./loadtest:/out
    environment:
      TOKENS_PATH: /out/tokens.json
      # Must be dev_user: the loader writes every tenant's rows, so it needs
      # to bypass RLS. The app role (lineview_app) would be blocked.
      DATABASE_URL: postgres://dev_user:dev_postgres@db:5432/lineview_db?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_postgres
      POSTGRES_DB: lineview_db
    ports:
      - "5432:5432"
    volumes:
      # PG18 images keep data under /var/lib/postgresql/18/docker,
      # so the volume mounts one level up.
      - postgres_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h localhost forces TCP, so "ready" is not reported while the
      # temporary init server (socket-only) is still running scripts.
      test: ["CMD-SHELL", "pg_isready -h localhost -U dev_user -d lineview_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  locust:
    image: locustio/locust:2.32.0
    profiles: ["load"]
    ports:
      - "8089:8089"
    volumes:
      - ./locust:/mnt/locust:ro
      - ./loadtest:/mnt/loadtest:ro
    environment:
      TOKENS_PATH: /mnt/loadtest/tokens.json
    command: -f /mnt/locust/locustfile.py --host http://api:8080
    depends_on:
      - api
volumes:
  postgres_data:
